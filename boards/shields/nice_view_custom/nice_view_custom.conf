# Enable nice!view
CONFIG_ZMK_DISPLAY=y
# Blank the display when idle to save battery (also pauses the right-hand animation)
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y
# White background, dark pixels (the nice!view renders the LVGL colours inverted)
CONFIG_NICE_VIEW_WIDGET_INVERTED=y
# Words-per-minute counter feeding the graph on the central half
CONFIG_ZMK_WPM=y
